# System configuration - every tunable setting lives here. Defaults are boostCX's.
# For per-machine changes, put overrides in configs/system.local.conf (gitignored, sourced
# last) rather than editing this file, so `git pull` never conflicts with your settings.

# Paths - derived from wherever this repo is cloned, so it runs from any location.
WORKSPACE_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
LOG_DIR="$WORKSPACE_ROOT/logs"
TEMP_DIR="$WORKSPACE_ROOT/temp"
SCRIPTS_DIR="$WORKSPACE_ROOT/scripts"
CONFIGS_DIR="$WORKSPACE_ROOT/configs"
STATE_DIR="$WORKSPACE_ROOT/state"
# Bugs collected by get-ado-bugs.sh, consumed by start-parallel-investigation.sh
ADO_BUGS_FILE="$TEMP_DIR/ado-bugs.json"

# GitHub settings
GITHUB_ORG="boostCX"
GITHUB_REPO="bcx-reporting-platform"
# Tracking issues are created as "<prefix><ADO bug title>", with this label and issue type
GITHUB_ISSUE_TITLE_PREFIX="Fix: "
GITHUB_ISSUE_LABEL="bug"
GITHUB_ISSUE_TYPE="Bug"

# Target application repo (kept separate from any other local working copy)
APP_REPO_URL="https://github.com/$GITHUB_ORG/$GITHUB_REPO"
APP_REPO_DIR="$HOME/source/repos/bcx-app"
APP_WORKTREE_DIR="$HOME/source/repos/bcx-app-worktrees"
# Base branch the shared investigation worktree is checked out from (override with --branch)
DEFAULT_BASE_BRANCH="main"

# Root-cause-analysis subagent the investigation prompt asks Claude to run. Must exist in the
# app repo's .claude/agents/ (a vendored fallback copy lives in agents/<name>.md).
RCA_AGENT_NAME="bcx-bug-rca-agent"

# Azure DevOps settings
ADO_ORG="https://dev.azure.com/boostCX"
ADO_PROJECT="New boostCX Platform"
ADO_WORK_ITEM_TYPE="Bug"
# Only bugs in ADO_NEW_STATE are collected; collecting one moves it to ADO_ACTIVE_STATE
ADO_NEW_STATE="New"
ADO_ACTIVE_STATE="Active"

# Migration tags. Bugs tagged MIGRATION_TAG are collected; afterwards the tag is swapped for
# MIGRATED_TAG (tracking issue created) or BLOCKED_TAG (agent needs more information).
MIGRATION_TAG="MigrateToGitHub"
MIGRATED_TAG="MigratedToGitHub"
BLOCKED_TAG="RequiresAdditionalInformation"

# Default number of bugs processed per run (override with --limit)
DEFAULT_LIMIT=1

# Herdr agent settings
HERDR_AGENT_KIND="claude"
# Max time for one investigation to finish once the agent has started working
HERDR_AGENT_TIMEOUT_MS="1800000"
# Max time for `herdr agent start` to bring Claude Code up in a pane
HERDR_AGENT_START_TIMEOUT_MS="45000"
# Max time to see the agent start working after its prompt is submitted
HERDR_PROMPT_CONFIRM_TIMEOUT_MS="15000"

# Max bugs investigated concurrently in start-parallel-investigation.sh. Firing every bug's
# pane/agent/prompt at once (confirmed live: 9 at once) starves all of them badly enough that
# the composer's submitting Enter never registers, even after herdr_prompt_and_wait's own
# recovery retries - every bug times out having typed its prompt but never submitted it.
MAX_PARALLEL_INVESTIGATIONS=4

# A report file smaller than this is treated as a failed investigation, not a real plan
MIN_REPORT_BYTES=200

# GitHub Projects v2 field wiring for tracking issues (node/field IDs - not portable across
# orgs, fetched live via `gh api graphql` against boostCX's actual project).
# "boostCX Delivery" (org project #3): ADO Linked Tickets (free text)
BOOSTCX_DELIVERY_PROJECT_ID="PVT_kwDOD8xwUs4BU1_F"
BOOSTCX_DELIVERY_ADO_FIELD_ID="PVTF_lADOD8xwUs4BU1_FzhZ-y5U"

# Per-machine overrides (optional, gitignored)
LOCAL_CONF="$CONFIGS_DIR/system.local.conf"
if [ -f "$LOCAL_CONF" ]; then source "$LOCAL_CONF"; fi
